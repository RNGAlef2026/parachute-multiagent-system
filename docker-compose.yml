services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: parachute_db
    environment:
      POSTGRES_USER: parachute
      POSTGRES_PASSWORD: parachute123
      POSTGRES_DB: parachute_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: